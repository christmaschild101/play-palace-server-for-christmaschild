# Timing settings (in ticks, 50ms each = 20 ticks/sec)
min_idle_ticks = 100      # 5 sec minimum between actions when idle
max_idle_ticks = 600      # 30 sec maximum between actions when idle
min_online_ticks = 1200   # 1 min minimum online before considering going offline
max_online_ticks = 6000   # 5 min maximum online
min_offline_ticks = 600   # 30 sec minimum offline
max_offline_ticks = 3000  # 2.5 min maximum offline
leave_game_delay_ticks = 200  # 10 sec - spread bot departures after game ends
start_game_delay_ticks = 400  # 20 sec - wait for players before starting

# Behavior probabilities (per decision tick when idle)
join_game_chance = 0.3    # Chance to try joining an existing game
create_game_chance = 0.1  # Chance to try creating a new game
go_offline_chance = 0.05  # Chance to go offline (when online long enough)

# Post-game logout behavior
logout_after_game_chance = 0.33    # 33% chance to log off after finishing a game
logout_after_game_min_ticks = 40   # 2 sec minimum delay before logout
logout_after_game_max_ticks = 100  # 5 sec maximum delay before logout

# Maximum tables virtual bots can own per game type (0 = unlimited)
# This limit applies to each game type separately.
# E.g., if set to 2, bots can own up to 2 scopa tables AND 2 ninetynine tables, etc.
max_tables_per_game = 0
# Default guided-table seat bounds for bots that don't have profile overrides
min_bots_per_table = 0
max_bots_per_table = 0
# Waiting window (in ticks) before bots retry joining a guided table after failure
waiting_min_ticks = 40
waiting_max_ticks = 100

# Behavior when no guided-table rule applies
#   "default"  - bots fall back to the probabilistic join/create logic
#   "disabled" - bots stay idle/offline unless a guided slot explicitly needs them
fallback_behavior = "default"
# Default profile applied to bots without an explicit profile assignment
default_profile = "default"
# Allocation policy when total bot pool can't satisfy all guided min_bots
#   "best_effort" (default) fills higher-priority tables first and warns if short
#   "strict" fails fast at startup if requirements exceed the pool
allocation_mode = "best_effort"

# Presence engine (server-side chat + session cadence). Opt-in: nothing changes
# for existing bots until presence_enabled = true AND a profile opts in.
[virtual_bots.presence]
enabled = false          # master switch; per-profile flags refine this
kill_switch = false      # instant pause of ALL bot chatter (persisted across restarts)

# Chat cadence (ticks; server tick = 50ms)
chat_min_ticks = 400     # 20s minimum gap between any two bot chats (global guardrail)
chat_max_ticks = 4800    # 4m maximum idle-chatter interval per bot
idle_chat_chance = 0.3   # chance an eligible idle bot chats when its timer fires

# Rate caps (guardrails)
max_chats_per_bot_per_hour = 20
max_chats_per_minute_global = 12
quiet_hours_start = 23   # hour of day (0-23), inclusive
quiet_hours_end = 7      # hour of day (0-23), exclusive
quiet_multiplier = 0.2   # activity multiplier during quiet hours

# Session cadence shaping: offline bots cluster their logins into short burst
# windows instead of trickling in one at a time. Active only while the master
# presence switch (enabled = true above) is on; otherwise bots log in as before.
# How it works: when a burst window is open every offline bot whose cooldown
# expires comes online together; the window stays open for burst_window_ticks,
# then a quiet stretch of burst_quiet_ticks is enforced before another burst can
# start. Each quiet stretch can start a new burst with burst_login_chance.
session_shape_enabled = true
burst_login_chance = 0.15   # chance a cycle boundary opens a burst window
burst_window_ticks = 1200   # how long a burst stays open (1 min at 50ms)
burst_quiet_ticks = 12000   # enforced pause between burst windows (10 min)
hesitation_factor = 1.5  # human-like pause multiplier before actions
afk_chance = 0.05
# (afk_min_ticks/afk_max_ticks default to 1200/6000 ticks = 1-5 min)

# Chat line pools (English defaults; each profile can override)
chat_lines_greeting = ["morning all", "hey everyone", "back again", "hello o/"]
chat_lines_ingame = ["nice move", "close one", "good luck all", "this is tense"]
chat_lines_postgame = ["gg", "good game", "well played", "rematch sometime?"]
chat_lines_idle = ["anyone up for a game?", "quiet in here", "brb coffee", "table open?"]

# Player-aware reaction pools: bots react to humans at their tables.
# The {player} placeholder is replaced with the human's username before
# broadcast. Any of these pools can also be overridden per profile under
# [virtual_bots.profiles.<name>] (single strings are accepted too).
chat_lines_join = [
    "hey {player}, welcome to the table",
    "oh nice, {player} joined us",
    "sit down {player}, we were just about to start",
]
chat_lines_takeover = ["welcome back {player}", "ah, {player} returned", "good to have you back {player}"]
chat_lines_gamestart = ["good luck {player}", "let's see what {player}'s got", "glhf {player}"]
chat_lines_gameend = ["gg {player}", "nice win {player}", "rematch sometime, {player}?"]

# Minimum gap (ticks; server tick = 50ms) between event-driven reactions at
# the same table. Prevents chatter storms when a table churns (join -> start ->
# end in quick succession). Set to 0 to disable.
table_event_cooldown_ticks = 3000

# Per-game line pools: bots use game-specific banter when chatting at a table
