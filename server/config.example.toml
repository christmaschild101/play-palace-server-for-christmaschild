# PlayPalace Server Configuration
# Important: Copy this file to config.toml first. Ccustomize as needed.

[auth]
# Auto-approve new accounts (skip admin approval step)
auto_approve_new_accounts = false
# Block new accounts from being registered
block_new_accounts = false
# These limits are enforced during both login and registration.
username_min_length = 3
username_max_length = 32
password_min_length = 8
password_max_length = 128
refresh_token_ttl_seconds = 2592000
[auth.rate_limits]
login_per_minute = 5
login_failures_per_minute = 3
registration_per_minute = 2
refresh_per_minute = 10
refresh_window_seconds = 60

[network]
# Maximum bytes accepted per websocket message (maps to websockets' max_size)
max_message_bytes = 1048576
# Allow ws:// without TLS (only for trusted local development)
allow_insecure_ws = false
# Paths to TLS certificate and key files (enables WSS). Both must be set together.
# For Let's Encrypt, use fullchain.pem and privkey.pem respectively.
# Leave commented out (or omit) to run without TLS (ws://).
#ssl_cert = "/etc/letsencrypt/live/yourdomain.com/fullchain.pem"
#ssl_key = "/etc/letsencrypt/live/yourdomain.com/privkey.pem"

[server]
# Bind interface IP address (default: 127.0.0.1). Use 127.0.0.1 for local-only
# access or 0.0.0.0 to listen on all interfaces.
bind_ip = "127.0.0.1"
# Port to listen on (default: 8000). Can be overridden at runtime with --port.
port = 8000
# Tick interval in milliseconds (default: 50ms = 20 ticks/sec)
# Lower values = faster game updates but more CPU usage
# Higher values = slower updates but less CPU usage
tick_interval_ms = 50

[documents]
# How document contributions are handled:
#   "manual"      - changes stay uncommitted; admin exports a ZIP file
#   "auto_commit" - server auto-commits after each save (default)
#   "auto_pr"     - auto-commit + admin can create a PR via the gh CLI
contribution_mode = "auto_commit"

[localization]
# Default locale for new users (and for auth flows without a client locale)
default_locale = "en"
# Only load these locales at startup (English is always included).
# Omit or leave empty to load all locales.
# enabled_locales = ["en"]

